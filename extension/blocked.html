<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Situs Diblokir — StudyBuddy</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif;
    background: #1E1B33;
    color: #fff;
  }
  .card { text-align: center; max-width: 380px; padding: 20px; }
  .icon { width: 64px; height: 64px; border-radius: 18px; background: rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; margin: 0 auto 20px; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; }
  p { color: #B8AEDF; font-size: 0.9rem; line-height: 1.6; margin: 0 0 24px; }
  .time { font-size: 2.2rem; font-weight: 800; margin-bottom: 24px; font-variant-numeric: tabular-nums; }
  a { display:inline-block; background:#3A3170; color:#fff; text-decoration:none; font-weight:700; font-size:0.9rem; padding: 12px 22px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <rect x="5" y="11" width="14" height="9" rx="2" />
        <path d="M8 11V7a4 4 0 018 0v4" />
      </svg>
    </div>
    <h1>Situs ini diblokir sementara</h1>
    <p>Kamu lagi dalam sesi fokus StudyBuddy. Situs ini bakal kebuka lagi begitu sesi fokus selesai.</p>
    <div class="time" id="time-display">--:--</div>
    <a href="#" id="open-popup">Buka StudyBuddy</a>
  </div>
  <script>
    function formatTime(totalSeconds) {
      const m = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const s = String(totalSeconds % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    async function tick() {
      const { timer } = await chrome.storage.local.get("timer");
      if (!timer) return;
      const secondsLeft = timer.running && timer.endAt
        ? Math.max(0, Math.round((timer.endAt - Date.now()) / 1000))
        : timer.secondsLeft;
      document.getElementById("time-display").textContent = formatTime(secondsLeft || 0);
    }

    tick();
    setInterval(tick, 1000);

    document.getElementById("open-popup").addEventListener("click", (e) => {
      e.preventDefault();
      chrome.action.openPopup?.();
    });
  </script>
</body>
</html>
