<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>StudyBuddy</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif;
    background: #FAF8FC;
    color: #1E1B33;
  }
  .p { padding: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .brand .box { width: 26px; height: 26px; border-radius: 8px; background: #3A3170; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .name { font-weight: 800; font-size: 0.95rem; }
  .card { background: #fff; border: 1px solid #EAE6F6; border-radius: 16px; padding: 20px; text-align: center; }
  .ring { width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .ring-inner { width: 84%; height: 84%; border-radius: 50%; background: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .time { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
  .mode { font-size: 0.72rem; color: #9C97B5; font-weight: 600; margin-top: 2px; }
  .controls { display:flex; align-items:center; justify-content:center; gap: 10px; margin-top: 14px; }
  button { border:none; font-family: inherit; cursor: pointer; }
  .btn-round { width: 40px; height: 40px; border-radius: 50%; background: #F3F1FA; display:flex; align-items:center; justify-content:center; }
  .btn-main { width: 58px; height: 58px; border-radius: 50%; background: #3A3170; display:flex; align-items:center; justify-content:center; }
  .presets { display:flex; gap: 6px; margin-top: 14px; justify-content: center; }
  .preset-btn { padding: 6px 10px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; background: #F3F1FA; color: #514C6B; }
  .preset-btn.active { background: #3A3170; color: #fff; }
  .debug-btn { margin-top: 10px; width: 100%; font-size: 0.72rem; font-weight: 700; color: #9A5347; background: #FBF2F0; padding: 7px; border-radius: 100px; border: 1px dashed #F3DCD6; }
  .links { display:flex; flex-direction: column; gap: 6px; margin-top: 14px; }
  .links a { font-size: 0.78rem; font-weight: 600; color: #4B4090; text-decoration: none; }
  .links a:hover { color: #3A3170; }
  .connect input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #EAE6F6; font-size: 0.82rem; font-family: monospace; margin-bottom: 8px; }
  .connect button.primary { width: 100%; background: #3A3170; color: #fff; font-weight: 700; font-size: 0.85rem; padding: 11px; border-radius: 10px; }
  .muted { font-size: 0.78rem; color: #9C97B5; line-height: 1.5; }
  .status { font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 100px; }
</style>
</head>
<body>
  <div id="root" class="p">
    <div class="muted">Memuat...</div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
